<div class="verification-page">
  <div class="banner-wrapper">
    <app-login-banner></app-login-banner>
  </div>

  <section class="form-section" aria-label="Email verification form">
    <div class="section-container form-container">
      <div class="verification-card">
        <header class="header-section">
          <div class="icon-wrapper" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              width="28"
              height="28"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="m3 7 9 6 9-6"></path>
              <path d="m8 16 2-2"></path>
              <path d="m16 16-2-2"></path>
            </svg>
          </div>
          <h2 class="form-title">Verify Your Email</h2>
          <p class="subtitle">Enter the verification code sent to {{ email() }}</p>
        </header>

        <form (submit)="onSubmit($event)" class="verification-form">
          <div class="form-group">
            <label class="form-label" for="verification-code">Verification code</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  width="18"
                  height="18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                  <path d="M7 8h.01M11 8h.01M15 8h.01M7 12h.01M11 12h.01M15 12h.01M7 16h.01M11 16h.01M15 16h.01"></path>
                </svg>
              </span>
              <input
                [formField]="verificationForm.code"
                type="text"
                id="verification-code"
                class="form-input"
                placeholder="Enter your code"
                autocomplete="one-time-code"
              />
            </div>
            @if (verificationForm.code().touched() && verificationForm.code().invalid()) {
            <ul class="error-list">
              @for (error of verificationForm.code().errors(); track error) {
              <li>{{ error.message }}</li>
              }
            </ul>
            }
          </div>

          <button
            [disabled]="verificationForm().invalid() || isLoading() || !email()"
            type="submit"
            class="submit-button"
          >
            <span class="button-content">Verify Email</span>
          </button>

          <p class="footer-text">
            Already verified?
            <a routerLink="/auth/login" class="login-link">Sign in</a>
          </p>
        </form>
      </div>
    </div>
  </section>
</div>
