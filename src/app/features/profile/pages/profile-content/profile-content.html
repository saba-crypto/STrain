<section class="profile-content" aria-labelledby="profile-title">
  <header class="section-header">
    <h1 class="section-title" id="profile-title">Personal Information</h1>
    <p class="section-description">
      Update your name, contact details and date of birth.
    </p>
  </header>

  <form class="profile-form">
    <div class="form-group">
      <label class="field-label" for="picture-url">Picture URL</label>
      <input
        class="field-input"
        id="picture-url"
        name="picture-url"
        type="url"
        placeholder="https://"
      />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="field-label" for="first-name">First Name</label>
        <input
          class="field-input"
          id="first-name"
          name="first-name"
          type="text"
          placeholder="First name"
          autocomplete="given-name"
        />
      </div>

      <div class="form-group">
        <label class="field-label" for="last-name">Last Name</label>
        <input
          class="field-input"
          id="last-name"
          name="last-name"
          type="text"
          placeholder="Last name"
          autocomplete="family-name"
        />
      </div>
    </div>

    <div class="form-group">
      <label class="field-label" for="email">Email Address</label>
      <input
        class="field-input"
        id="email"
        name="email"
        type="email"
        value="user@example.com"
        autocomplete="email"
        disabled
      />
    </div>

    <div class="form-group">
      <label class="field-label" for="phone-number">Phone Number</label>
      <input
        class="field-input"
        id="phone-number"
        name="phone-number"
        type="tel"
        placeholder="e.g. +995 555 010 010"
        autocomplete="tel"
      />
    </div>

    <div class="form-group">
      <label class="field-label" for="address">Address</label>
      <input
        class="field-input"
        id="address"
        name="address"
        type="text"
        placeholder="Your address"
        autocomplete="street-address"
      />
    </div>

    <div class="form-group">
      <label class="field-label" for="date-of-birth">Date of Birth</label>
      <input
        class="field-input"
        id="date-of-birth"
        name="date-of-birth"
        type="date"
        autocomplete="bday"
      />
    </div>

    <div class="form-actions">
      <button class="save-button" type="submit">Save Changes</button>
    </div>
  </form>
</section>
