<div class="bookings-content" aria-labelledby="bookings-title">
  <div class="section-header">
    <h1 class="section-title" id="bookings-title">My Bookings</h1>
    <p class="section-description">View and manage all your train reservations.</p>
  </div>

  <form class="bookings-filter">
    <div class="filter-field">
      <label class="field-label" for="from-date">From Date</label>
      <input class="field-input field-input--small" id="from-date" name="from-date" type="date" />
    </div>

    <div class="filter-field">
      <label class="field-label" for="to-date">To Date</label>
      <input class="field-input field-input--small" id="to-date" name="to-date" type="date" />
    </div>

    <div class="filter-actions">
      <button class="button button--primary button--small" type="submit">Filter</button>
      <button class="button button--ghost button--small" type="reset">Clear</button>
    </div>
  </form>

  <div class="bookings-list">
    <article class="booking-card">
      <div class="booking-main">
        <div class="booking-route">
          <span class="booking-city">Tbilisi</span>
          <svg
            class="route-icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M5 12h14M13 6l6 6-6 6"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="booking-city">Batumi</span>
        </div>

        <div class="booking-meta">
          <span class="booking-train">Georgian Railway #801</span>
          <span class="booking-separator" aria-hidden="true">·</span>
          <time class="booking-time" datetime="08:30">08:30</time>
          <span class="booking-separator" aria-hidden="true">·</span>
          <time class="booking-date" datetime="2026-06-15">Jun 15, 2026</time>
        </div>
      </div>

      <div class="booking-details">
        <div class="booking-seat">
          <span class="badge badge--gold">Economy</span>
          <span class="seat-number">Seat 12</span>
        </div>
        <span class="coach-number">Coach 3</span>
        <span class="booking-price">$25</span>
      </div>

      <div class="booking-actions">
        <a class="button button--outline button--small" href="/profile/bookings/801"> Details </a>
        <button class="button button--danger button--small" type="button">Delete</button>
      </div>
    </article>

    <article class="booking-card">
      <div class="booking-main">
        <div class="booking-route">
          <span class="booking-city">Batumi</span>
          <svg
            class="route-icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M5 12h14M13 6l6 6-6 6"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="booking-city">Tbilisi</span>
        </div>

        <div class="booking-meta">
          <span class="booking-train">Georgian Railway #802</span>
          <span class="booking-separator" aria-hidden="true">·</span>
          <time class="booking-time" datetime="17:45">17:45</time>
          <span class="booking-separator" aria-hidden="true">·</span>
          <time class="booking-date" datetime="2026-06-20">Jun 20, 2026</time>
        </div>
      </div>

      <div class="booking-details">
        <div class="booking-seat">
          <span class="badge badge--gold">Economy</span>
          <span class="seat-number">Seat 8</span>
        </div>
        <span class="coach-number">Coach 2</span>
        <span class="booking-price">$25</span>
      </div>

      <div class="booking-actions">
        <a class="button button--outline button--small" href="/profile/bookings/802"> Details </a>
        <button class="button button--danger button--small" type="button">Delete</button>
      </div>
    </article>
  </div>

  <nav class="pagination" aria-label="Bookings pagination">
    <button class="button button--outline button--small" type="button" disabled>Prev</button>
    <span class="pagination-info">1 / 1</span>
    <button class="button button--outline button--small" type="button" disabled>Next</button>
  </nav>
</div>
