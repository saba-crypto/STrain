<div class="bookings-content" aria-labelledby="bookings-title">
  <div class="section-header">
    <h1 class="section-title" id="bookings-title">My Bookings</h1>
    <p class="section-description">View and manage all your train reservations.</p>
  </div>

  <form class="bookings-filter">
    <div class="filter-field">
      <label class="field-label" for="from-date">From Date</label>
      <input class="field-input field-input--small" id="from-date" name="from-date" type="date" />
    </div>

    <div class="filter-field">
      <label class="field-label" for="to-date">To Date</label>
      <input class="field-input field-input--small" id="to-date" name="to-date" type="date" />
    </div>

    <div class="filter-actions">
      <button class="button button--primary button--small" type="submit">Filter</button>
      <button class="button button--ghost button--small" type="reset">Clear</button>
    </div>
  </form>

  <div class="bookings-list">
    @if (bookingsResource.value(); as data) { @for (booking of data.items; track booking.id) {
    <app-booking-card [booking]="booking"></app-booking-card>

    } @empty {
    <app-booking-empty-state></app-booking-empty-state>
    } }
  </div>

  @if (bookingsResource.value()?.items?.length) {
  <nav class="pagination" aria-label="Bookings pagination">
    <button class="button button--outline button--small" type="button" disabled>Prev</button>
    <span class="pagination-info">1 / 1</span>
    <button class="button button--outline button--small" type="button" disabled>Next</button>
  </nav>
  }
</div>
