@if (booking(); as booking) {
<article class="booking-card">
  <div class="booking-main">
    <div class="booking-route">
      <span class="booking-city">{{booking.origin}}</span>
      <svg
        class="route-icon"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M5 12h14M13 6l6 6-6 6"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span class="booking-city">{{booking.destination}}</span>
    </div>

    <div class="booking-meta">
      <span class="booking-train">{{booking.trainName}} #{{booking.trainNumber}}</span>
      <span class="booking-separator" aria-hidden="true">·</span>
      <time class="booking-time">{{booking.departureTime}}</time>
      <span class="booking-separator" aria-hidden="true">·</span>
      <time class="booking-date">{{booking.travelDate | date}}</time>
    </div>
  </div>

  <div class="booking-details">
    <div class="booking-seat">
      <span class="badge badge--gold">{{booking.coachClass}}</span>
      <span class="seat-number">Seat {{booking.seatNumber}}</span>
    </div>
    <span class="coach-number">Coach {{booking.coachNumber}}</span>
    <span class="booking-price">{{booking.price | currency}}</span>
  </div>

  <div class="booking-actions">
    <a
      class="button button--outline button--small"
      [routerLink]="['/profile/bookings', booking.id]"
    >
      Details
    </a>
    <button
      (click)="removeBooking(booking.id)"
      class="button button--danger button--small"
      type="button"
    >
      Delete
    </button>
  </div>
</article>
}
