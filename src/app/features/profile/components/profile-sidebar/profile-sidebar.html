<aside class="profile-sidebar">
  @if (!profileImageUrl) {
  <div class="profile-avatar" aria-hidden="true">PU</div>

  } @else {
  <img class="profile-avatar" [src]="profileImageUrl()" alt="userProfileImage" />
  }

  <div class="profile-info">
    <h2 class="profile-name">Profile User</h2>
    <p class="profile-email">user@example.com</p>
  </div>

  <nav class="profile-navigation" aria-label="Profile navigation">
    <a
      class="profile-navigation-link"
      routerLink="./"
      routerLinkActive="profile-navigation-link-active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5" />
        <path
          d="M4 20c0-4 3.6-7 8-7s8 3 8 7"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
      <span>My Profile</span>
    </a>

    <a
      class="profile-navigation-link"
      routerLink="bookings"
      routerLinkActive="profile-navigation-link-active"
    >
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.5" />
        <path
          d="M16 2v4M8 2v4M3 10h18M8 14h8M8 18h5"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
      <span>My Bookings</span>
    </a>

    <a
      class="profile-navigation-link"
      routerLink="settings"
      routerLinkActive="profile-navigation-link-active"
    >
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" />
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15H4a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09A1.65 1.65 0 0 0 19.4 15Z"
          stroke="currentColor"
          stroke-width="1.5"
        />
      </svg>
      <span>Settings</span>
    </a>
  </nav>

  <button (click)="logout()" class="profile-logout" type="button">
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none">
      <path
        d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <span>Sign Out</span>
  </button>
</aside>
