<article class="feature-card">
  <div class="feature-icon" aria-hidden="true">
    @switch (feature.icon) {
      @case ('classes') {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path
            d="M12 2 2 7l10 5 10-5-10-5ZM2 17l10 5 10-5M2 12l10 5 10-5"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linejoin="round"
          />
        </svg>
      }
      @case ('dates') {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.5" />
          <path
            d="M16 2v4M8 2v4M3 10h18"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>
      }
      @case ('seat') {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M20 12v10H4V12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          <path d="M22 7H2v5h20V7Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
          <path
            d="M12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7Zm0 0h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7Z"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>
      }
      @case ('confirmation') {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path
            d="m9 12 2 2 4-4"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" />
        </svg>
      }
    }
  </div>
  <h3 class="feature-title">{{ feature.title }}</h3>
  <p class="feature-description">{{ feature.description }}</p>
</article>
