<section class="hero">
  <div class="hero-background"></div>

  <div class="hero-content">
    <span class="hero-tag">Saba Trains</span>

    <h1 class="hero-title">
      Travel Smarter,<br />
      Journey Farther
    </h1>

    <p class="hero-subtitle">Search thousands of train routes and book your seats in seconds.</p>

    <div class="hero-search">
      <div class="search-field">
        <label class="search-label" for="origin">From</label>
        <select
          class="search-select from-input"
          id="origin"
          [value]="origin()"
          #originSelect
          (change)="onOriginChange(originSelect.value)"
        >
          <option value="" [selected]="!origin()">Origin city or station</option>
          @for (station of stations(); track station.id) {
          <option [value]="station.name">{{ station.name }}</option>
          }
        </select>
      </div>

      <div class="search-divider" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path
            d="M5 12h14M13 6l6 6-6 6"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>
        </svg>
      </div>

      <div class="search-field">
        <label class="search-label" for="destination">To</label>
        <select
          class="search-select destination-input"
          id="destination"
          [value]="destination()"
          #destinationSelect
          (change)="onDestinationChange(destinationSelect.value)"
        >
          <option value="" [selected]="!destination()">Destination city or station</option>
          @for (station of stations(); track station.id) {
          <option [value]="station.name">{{ station.name }}</option>
          }
        </select>
      </div>

      <default-button class="btn--small btn--full-width search-submit-btn" (click)="onSearch()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="1.5"></circle>
          <path
            d="m21 21-4.35-4.35"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          ></path>
        </svg>
        Search
      </default-button>
    </div>
  </div>
</section>
