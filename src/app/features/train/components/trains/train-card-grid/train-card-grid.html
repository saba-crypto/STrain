<div class="trains-grid">
  @if (trains() || trains().length > 0) { @for (train of trains(); track train.id) {
  <app-train-card [train]="train"></app-train-card>
  }@empty {
  <section class="empty-state" aria-live="polite">
    <svg
      class="state-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      aria-hidden="true"
    >
      <path d="M5 18h14M7 18V5.5A1.5 1.5 0 0 1 8.5 4h7A1.5 1.5 0 0 1 17 5.5V18" />
      <path d="M7 9h10M7 13h10M9 18v1M15 18v1" />
      <circle cx="9" cy="16" r="1" fill="currentColor" stroke="none" />
      <circle cx="15" cy="16" r="1" fill="currentColor" stroke="none" />
    </svg>
    <h2>No trains found</h2>
    <p>Try changing your search or filters to find available trains.</p>
  </section>
  } } @else {
  <section class="error-state" role="alert">
    <svg
      class="state-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="8.5" />
      <path d="M12 8v5M12 16.5v.5" stroke-linecap="round" />
    </svg>
    <h2>Unable to load trains</h2>
    <p>Something went wrong while fetching trains. Please try again.</p>
  </section>
  }
</div>
