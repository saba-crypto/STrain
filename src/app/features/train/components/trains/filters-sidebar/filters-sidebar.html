<aside class="filters-sidebar">
  <div class="filters-content">
    <div class="filters-section">
      <h2 class="filters-title">Search</h2>

      <div class="filters-group">
        <p class="filters-label">Train number</p>
        <input
          #searchInput
          class="filters-input"
          id="train-search"
          type="search"
          placeholder="e.g. Express, 42..."
        />
        <button
          (click)="onSearch(searchInput.value)"
          class="filters-button filters-button-primary"
          type="button"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.5" />
            <path d="m16 16 5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          Search
        </button>
      </div>
    </div>

    <div class="filters-section">
      <h2 class="filters-title">Filter by route</h2>

      <div class="filters-group">
        <p class="filters-label">From</p>
        <select class="filters-input" id="origin">
          <option selected value="">Any origin</option>
          @for (station of stations(); track station.id) {
          <option [value]="station.name">{{station.name}}</option>
          }
          <!--<option value="">Any origin</option>
          <option value="tbilisi">Tbilisi</option>
          <option value="batumi">Batumi</option>
          <option value="kutaisi">Kutaisi</option>-->
        </select>
      </div>

      <div class="filters-group">
        <p class="filters-label">To</p>
        <select class="filters-input" id="destination">
          <option selected value="">Any destination</option>
          @for (station of stations(); track station.id) {
          <option [value]="station.name">{{station.name}}</option>
          }
        </select>
      </div>

      <div class="filters-actions">
        <button class="filters-button filters-button-primary" type="button">Apply filter</button>
        <button class="filters-button filters-button-ghost" type="button">Clear</button>
      </div>
    </div>
  </div>
</aside>
