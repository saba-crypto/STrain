<a [routerLink]="['/trains', train().id]">
  <article class="train-card">
    <div class="train-card-image" aria-hidden="true">
      <img [src]="train().thumbnail" alt="" />
    </div>

    <div class="train-card-body">
      <header class="train-card-header">
        <span class="train-card-number">Train #{{train().number}}</span>
        <span class="train-card-badge">Express</span>
      </header>

      <h3 class="train-card-name">{{train().name}}</h3>

      <div class="train-card-stats">
        <span class="train-card-stat">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
          {{train().coachesCount}} coaches
        </span>
        <span class="train-card-stat">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M3 17h18M5 17V9a7 7 0 0 1 14 0v8M7 21l2-4m8 4-2-4"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          {{train().totalSeats}} seats
        </span>
      </div>
    </div>

    <span class="train-card-arrow" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path
          d="m9 18 6-6-6-6"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>
  </article>
</a>
